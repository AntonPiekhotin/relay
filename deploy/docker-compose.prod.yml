# Relay — production stack, single host.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#

name: relay

# ── shared fragments ────────────────────────────────────────────────────────────────────────
#
# Everything a Relay service needs regardless of which one it is. Anchors rather than `extends`
# because anchors merge maps, and `extends` cannot pull in a partial environment block.
x-service-base: &service-base
  restart: unless-stopped
  networks: [relay-network]
  volumes:
    # Every service writes ECS JSON here; filebeat reads the same volume. This replaces the dev
    # setup's read-only bind mount of the repo, which does not exist on a server.
    - relay-logs:/var/log/relay
  logging:
    # The JSON file driver is unbounded by default, and the console stream stays at DEBUG.
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

x-service-env: &service-env
  # issuer-uri must be the PUBLIC URL — it is compared against the token's `iss` claim, which
  # Keycloak stamps from KC_HOSTNAME. jwk-set-uri is the internal address, so key fetches never
  # leave the bridge network or hairpin through nginx. Spring uses jwk-set-uri when both are set
  # and applies issuer-uri as a claim validator, which is exactly the split wanted here.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${AUTH_HOST}/realms/relay-realm
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/relay-realm/protocol/openid-connect/certs
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
  # Containers register their bridge IP rather than a hostname. Compose DNS would resolve the
  # service name too, but the IP removes any dependency on what the JVM thinks its hostname is.
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  RELAY_LOG_DIR: /var/log/relay
  LOGGING_LEVEL_COM_RELAY: INFO
  LOGGING_THRESHOLD_CONSOLE: INFO
  TZ: UTC

# For the five services that listen on 8080 inside their own container. websocket-gateway (8083)
# and call (8084) keep their fixed ports and declare their own healthcheck below.
x-service-healthcheck: &service-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 90s

x-postgres-base: &postgres-base
  image: postgres:15
  restart: unless-stopped
  networks: [relay-network]
  # No `ports:`. Deliberate, and the main thing this file exists to enforce.
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  # ══ discovery ═══════════════════════════════════════════════════════════════════════════════
  eureka:
    <<: *service-base
    image: ${RELAY_REGISTRY:-relay}/eureka:${EUREKA_TAG:-latest}
    container_name: relay-eureka
    environment:
      RELAY_LOG_DIR: /var/log/relay
      LOGGING_LEVEL_COM_RELAY: INFO
      LOGGING_THRESHOLD_CONSOLE: INFO
      # Its own defaultZone is built from this; left as `localhost` it would advertise a URL no
      # other container can reach.
      EUREKA_INSTANCE_HOSTNAME: eureka
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m

  # ══ application services ════════════════════════════════════════════════════════════════════
  api-gateway:
    <<: [*service-base, *service-healthcheck]
    image: ${RELAY_REGISTRY:-relay}/api-gateway:${API_GATEWAY_TAG:-latest}
    container_name: relay-api-gateway
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
    depends_on:
      eureka: { condition: service_healthy }
      keycloak: { condition: service_started }
    mem_limit: 512m

  auth:
    <<: [*service-base, *service-healthcheck]
    image: ${RELAY_REGISTRY:-relay}/auth:${AUTH_TAG:-latest}
    container_name: relay-auth
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
      # Admin and token calls go to the container directly; only the issuer is public.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: relay-realm
      KEYCLOAK_CLIENT_ID: relay-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET}
      # NOTE: auth reads a bare `kafka.bootstrap-servers`, not `spring.kafka.*` like the others.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      eureka: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_started }
    mem_limit: 512m

  user:
    <<: [*service-base, *service-healthcheck]
    image: ${RELAY_REGISTRY:-relay}/user:${USER_TAG:-latest}
    container_name: relay-user
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER:-relay_user}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
    depends_on:
      eureka: { condition: service_healthy }
      user-db: { condition: service_healthy }
    mem_limit: 640m

  message:
    <<: [*service-base, *service-healthcheck]
    image: ${RELAY_REGISTRY:-relay}/message:${MESSAGE_TAG:-latest}
    container_name: relay-message
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://message-db:5432/message
      SPRING_DATASOURCE_USERNAME: ${MESSAGE_DB_USER:-relay_message}
      SPRING_DATASOURCE_PASSWORD: ${MESSAGE_DB_PASSWORD:?set MESSAGE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      eureka: { condition: service_healthy }
      message-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 768m

  notification:
    <<: [*service-base, *service-healthcheck]
    image: ${RELAY_REGISTRY:-relay}/notification:${NOTIFICATION_TAG:-latest}
    container_name: relay-notification
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER:-relay_notification}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # The dev default is `file:../secrets/...`, a relative path that resolves to nothing here.
      RELAY_PUSH_FCM_CREDENTIALS_LOCATION: file:/run/secrets/fcm.json
      RELAY_PUSH_APNS_ENABLED: ${APNS_ENABLED:-false}
      RELAY_PUSH_APNS_SIGNING_KEY_LOCATION: file:/run/secrets/apns.p8
      RELAY_PUSH_APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      RELAY_PUSH_APNS_KEY_ID: ${APNS_KEY_ID:-}
      RELAY_PUSH_APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.relay.app}
      RELAY_PUSH_APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
    volumes:
      - relay-logs:/var/log/relay
      # Read-only, and outside the image — a service-account key baked into a layer is a key that
      # leaks with the image.
      - ${SECRETS_DIR:-../secrets}:/run/secrets:ro
    depends_on:
      eureka: { condition: service_healthy }
      notification-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 640m

  websocket-gateway:
    <<: *service-base
    image: ${RELAY_REGISTRY:-relay}/websocket-gateway:${WEBSOCKET_GATEWAY_TAG:-latest}
    container_name: relay-websocket-gateway
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      eureka: { condition: service_healthy }
      kafka: { condition: service_healthy }
    # Exactly one replica, and this is load-bearing rather than a default: presence is decided
    # from each node's in-memory registry, so a second node would declare users connected
    # elsewhere offline. See ARCHITECTURE.md §6 / build-order item 7.
    mem_limit: 1g

  call:
    <<: *service-base
    image: ${RELAY_REGISTRY:-relay}/call:${CALL_TAG:-latest}
    container_name: relay-call
    environment:
      <<: *service-env
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://call-db:5432/call
      SPRING_DATASOURCE_USERNAME: ${CALL_DB_USER:-relay_call}
      SPRING_DATASOURCE_PASSWORD: ${CALL_DB_PASSWORD:?set CALL_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # `url` is handed to clients, `api-url` is what this service calls — the two diverge the
      # moment anything leaves localhost, which is why they were two settings from day one.
      RELAY_CALL_LIVEKIT_URL: wss://${SFU_HOST}
      RELAY_CALL_LIVEKIT_API_URL: http://livekit:7880
      RELAY_CALL_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      RELAY_CALL_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      # A comma-separated value binds to the List<String> property; the YAML list is the dev
      # default and is replaced wholesale by this. Without it clients are handed stun:localhost.
      RELAY_CALL_TURN_URLS: stun:${TURN_HOST}:3478,turn:${TURN_HOST}:3478?transport=udp,turn:${TURN_HOST}:3478?transport=tcp,turns:${TURN_HOST}:5349?transport=tcp
      RELAY_CALL_TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      eureka: { condition: service_healthy }
      call-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 640m

  # ══ datastores ══════════════════════════════════════════════════════════════════════════════
  #
  # One Postgres per data-owning service (CLAUDE.md invariant 4). Consolidating them into one
  # container with four databases would save ~600 MB and is tempting on a single box — it is not
  # done here because the invariant is about independent deployables, and a shared server is a
  # shared failure domain and a shared upgrade window.
  user-db:
    <<: *postgres-base
    container_name: relay-user-db
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: ${USER_DB_USER:-relay_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-relay_user} -d user"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - user-db-data:/var/lib/postgresql/data

  message-db:
    <<: *postgres-base
    container_name: relay-message-db
    environment:
      POSTGRES_DB: message
      POSTGRES_USER: ${MESSAGE_DB_USER:-relay_message}
      POSTGRES_PASSWORD: ${MESSAGE_DB_PASSWORD:?set MESSAGE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MESSAGE_DB_USER:-relay_message} -d message"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - message-db-data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres-base
    container_name: relay-notification-db
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-relay_notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-relay_notification} -d notification"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  call-db:
    <<: *postgres-base
    container_name: relay-call-db
    environment:
      POSTGRES_DB: call
      POSTGRES_USER: ${CALL_DB_USER:-relay_call}
      POSTGRES_PASSWORD: ${CALL_DB_PASSWORD:?set CALL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CALL_DB_USER:-relay_call} -d call"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - call-db-data:/var/lib/postgresql/data

  keycloak-postgres:
    <<: *postgres-base
    container_name: relay-keycloak-db
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  session-registry:
    image: redis:7.4-alpine
    container_name: relay-session-registry
    restart: unless-stopped
    networks: [relay-network]
    # Nothing connects to this yet — the session registry is still an in-memory map in
    # websocket-gateway (build-order item 7). The password is set now so that work cannot ship
    # against an open Redis by omission.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly no
      --save ""
    volumes:
      - session-registry-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 640m

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: relay-kafka
    restart: unless-stopped
    networks: [relay-network]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Yup6_T7LRHezOApR2tbRQA}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The dev file also carries an EXTERNAL listener on 9092 advertised as localhost, purely so
      # host JVMs could reach it. Every client is a container here, so it is gone — one listener,
      # never published, unreachable from outside the bridge.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    mem_limit: 1500m

  # kafka-ui is absent on purpose. It is an unauthenticated read/write console over every topic.

  # ══ identity ════════════════════════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: relay-keycloak
    restart: unless-stopped
    networks: [relay-network]
    # `start`, not `start-dev`: the dev mode disables hostname checks and HTTPS requirements and
    # runs an in-memory cache. --optimized is deliberately NOT used; it requires a prior
    # `kc.sh build` baked into a derived image, and skipping the build step with it set produces
    # a confusing startup failure rather than a clear one.
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # TLS terminates at nginx, so Keycloak speaks plain HTTP on the bridge — but it must be told
      # that, or every redirect and every `iss` claim comes out as http://<container>:8080.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HOSTNAME_STRICT: "true"
      # false pins the backchannel to KC_HOSTNAME as well, which is what makes a token minted via
      # the internal address still carry the public issuer that every resource server validates.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      # --import-realm SKIPS a realm that already exists. It seeds an empty database on first
      # boot and is not a deployment mechanism for realm changes — see deploy/README.md.
      - ../keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-postgres: { condition: service_healthy }
    healthcheck:
      # 9000 is the management port KC_HEALTH_ENABLED opens; the image has no curl, hence bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 1g

  # ══ media plane ═════════════════════════════════════════════════════════════════════════════
  #
  # Media never traverses a service, a queue, or a database. These two are the only server-side
  # involvement in audio and video, and they are the only containers besides nginx with published
  # ports — a TURN relay nobody can reach is not a relay.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: relay-coturn
    restart: unless-stopped
    network_mode: host
    # Host networking, not a bridge with published ports. coturn allocates a relay port per
    # session out of the range below, and Docker's userland proxy mangles the source address of
    # UDP it forwards — which breaks the permission checks TURN makes per peer. Host networking
    # also makes --external-ip unnecessary for the common case, but it is kept because the box
    # may sit behind a cloud NAT that the interface address does not reflect.
    command: >
      turnserver
      --listening-port=3478
      --tls-listening-port=5349
      --realm=${TURN_HOST}
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET}
      --external-ip=${PUBLIC_IP:?set PUBLIC_IP}
      --min-port=49160
      --max-port=49200
      --stale-nonce=600
      --no-tcp-relay
      --no-multicast-peers
      --cert=/etc/letsencrypt/live/${TURN_HOST}/fullchain.pem
      --pkey=/etc/letsencrypt/live/${TURN_HOST}/privkey.pem
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --user-quota=4
      --total-quota=40
      --max-bps=500000
      --bps-capacity=6000000
      --no-rfc5780
      --no-stun-backward-compatibility
      --response-origin-only-with-rfc5780
      --no-software-attribute
      --no-cli
      --log-file=stdout
      --simple-log
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m

  livekit:
    image: livekit/livekit-server:v1.9
    container_name: relay-livekit
    restart: unless-stopped
    networks: [relay-network]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${PUBLIC_IP}
        room:
          auto_create: true
          empty_timeout: 60
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            # Container-to-container now. The dev file has to route this through
            # host.docker.internal because the services are host JVMs there.
            - http://call:8084/internal/api/v1/livekit/webhooks
    ports:
      # 7880 (signaling) is NOT published — it goes through nginx so clients get wss://. These two
      # carry media and cannot be proxied by nginx.
      - "7881:7881"
      - "7882:7882/udp"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 512m

  # ══ edge ════════════════════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: relay-nginx
    restart: unless-stopped
    networks: [relay-network]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    environment:
      # The edge is a SINGLE vhost routed by path, so this is the only hostname the template
      # reads. AUTH_HOST, SFU_HOST and TURN_HOST are still read elsewhere — by Keycloak, by
      # call-service and by coturn — and all four must hold the SAME value; see the header of
      # nginx/conf.d/relay.conf.template. Kibana is no longer a vhost at all (ssh tunnel), which
      # is why KIBANA_HOST and ADMIN_ALLOW_CIDR are absent here.
      RELAY_API_HOST: ${API_HOST:?set API_HOST}
      # envsubst would otherwise also expand $host, $remote_addr and every other nginx variable
      # in the template into empty strings. The filter restricts it to our own prefix, which is
      # the whole reason these are RELAY_-prefixed here and not in .env.
      NGINX_ENVSUBST_FILTER: "^RELAY_"
    # The image's entrypoint renders /etc/nginx/templates/*.template into conf.d, then execs this.
    # default.conf ships in the image and also claims `default_server` on 80 — two of those is a
    # startup failure, so it goes first. The reload loop picks up a renewed certificate without a
    # restart; certbot writes into the shared letsencrypt volume.
    # `exec /docker-entrypoint.sh nginx ...` rather than `exec nginx ...`, and that is
    # load-bearing. The image's entrypoint runs /docker-entrypoint.d/ — which is where
    # 20-envsubst-on-templates.sh renders conf.d/*.template into conf.d/*.conf — ONLY when its
    # first argument is literally `nginx`. Overriding `command:` with `/bin/sh -c ...` makes $1
    # `/bin/sh`, so the templating silently never runs; combined with the `rm` below that leaves
    # nginx with zero server blocks, listening on nothing and resetting every connection while
    # the container still reports healthy. Calling the entrypoint explicitly restores it.
    command: >
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf;
                  while :; do sleep 6h & wait $${!}; nginx -s reload; done &
                  exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    depends_on:
      api-gateway: { condition: service_started }
      websocket-gateway: { condition: service_started }
      keycloak: { condition: service_started }
    mem_limit: 256m

  certbot:
    image: certbot/certbot:latest
    container_name: relay-certbot
    restart: unless-stopped
    networks: [relay-network]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renewal only. The FIRST certificate is issued by deploy/init-letsencrypt.sh, because nginx
    # cannot start to serve the ACME challenge until a certificate it can load already exists.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
                  while :; do certbot renew --webroot -w /var/www/certbot --quiet;
                  sleep 12h & wait $${!}; done"

  # ══ logging ═════════════════════════════════════════════════════════════════════════════════
  #
  # Not behind a compose profile here — on a server with no console to tail, this pipeline is the
  # only way to see what happened. Budget ~2.2 GB for the four of them.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.4}
    container_name: relay-elasticsearch
    restart: unless-stopped
    networks: [relay-network]
    environment:
      node.name: relay-es
      discovery.type: single-node
      # Unlike dev, security is ON. Not because the port is published — it is not — but because
      # this index holds every log line the system produces, and one firewall mistake would
      # otherwise make all of it anonymously full-text searchable.
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      # HTTP TLS is off: every client is a container on this bridge, and terminating TLS here
      # would mean managing a second CA for no gain on a single host.
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ingest.geoip.downloader.enabled: "false"
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: "-Xms768m -Xmx768m"
      cluster.routing.allocation.disk.watermark.low: 90%
      cluster.routing.allocation.disk.watermark.high: 95%
      cluster.routing.allocation.disk.watermark.flood_stage: 97%
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    mem_limit: 1500m

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.17.4}
    container_name: relay-logstash
    restart: unless-stopped
    networks: [relay-network]
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.monitoring.enabled: "false"
      HTTP_HOST: "0.0.0.0"
      CONFIG_RELOAD_AUTOMATIC: "true"
      CONFIG_RELOAD_INTERVAL: "15s"
      PIPELINE_WORKERS: "2"
      PIPELINE_BATCH_SIZE: "250"
      LOG_LEVEL: "info"
      # Read by elk/logstash/pipeline/relay.conf — one pipeline file serves both environments.
      RELAY_ENV: production
      RELAY_ES_NAMESPACE: prod
      RELAY_ES_USER: elastic
      RELAY_ES_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ../elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/stats >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 120s
    mem_limit: 768m

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.4}
    container_name: relay-kibana
    restart: unless-stopped
    networks: [relay-network]
    ports:
      # Bound to LOOPBACK, not 0.0.0.0 — the one host port in this file that is not a published
      # one. Nothing off the box can reach it; `ssh -L 5601:localhost:5601 <box>` can. This is
      # what replaced the logs.<domain> vhost when the edge collapsed to a single hostname: the
      # index holds every log line the system produces, and a login page for it does not belong
      # on the public internet of a one-box deploy.
      - "127.0.0.1:5601:5601"
    environment:
      SERVER_NAME: kibana
      # Reached through an ssh tunnel on localhost, not through nginx — so the base URL it
      # generates for itself has to match what the browser typed at the other end of the tunnel.
      SERVER_PUBLICBASEURL: http://localhost:5601
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      # Set by deploy/bootstrap-elk.sh — the kibana_system password cannot be supplied at
      # Elasticsearch bootstrap, only through the security API after it is up.
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?set KIBANA_SYSTEM_PASSWORD}
      # Must be >= 32 chars and STABLE. Regenerating it loses every saved object, data views
      # included, which presents as "Kibana forgot everything after a restart".
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY}
      NODE_OPTIONS: "--max-old-space-size=768"
      TELEMETRY_OPTIN: "false"
    depends_on:
      elasticsearch: { condition: service_healthy }
    mem_limit: 1g

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.17.4}
    container_name: relay-filebeat
    restart: unless-stopped
    networks: [relay-network]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ../elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # The services write to /var/log/relay/json inside their own containers; the same volume is
      # mounted here at the path the existing globs and the logstash grok already expect, so the
      # dev filebeat config works unchanged.
      - relay-logs:/relay-repo/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      logstash: { condition: service_started }
    mem_limit: 256m

volumes:
  user-db-data:
  message-db-data:
  notification-db-data:
  call-db-data:
  keycloak-db-data:
  kafka-data:
  session-registry-data:
  elasticsearch-data:
  filebeat-data:
  relay-logs:
  letsencrypt:
  certbot-webroot:
  nginx-cache:

networks:
  relay-network:
    driver: bridge
