# Relay edge. TLS terminates here and nothing else is reachable from outside the host except
# coturn and LiveKit's two media ports, which cannot be proxied.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $request_id is nginx's own per-request hex id; $relay_request_id below prefers an inbound
    # header so a client-supplied id survives. RequestIdFilter in `common` adopts the header when
    # present and only mints one when it is absent, so nothing on the Java side changes.
    map $http_x_request_id $relay_request_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # WebSocket upgrade: `Connection: upgrade` only when the client actually asked for it.
    # A hardcoded `Connection: upgrade` on a plain request breaks keepalive on the whole route.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    log_format  relay  '$remote_addr - $host "$request" $status $body_bytes_sent '
                       'rt=$request_time ua="$upstream_addr" ut="$upstream_response_time" '
                       'rid=$relay_request_id';
    access_log  /var/log/nginx/access.log  relay;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Avatar upload caps at 10 MB (spring.servlet.multipart.max-file-size in user). A little
    # headroom for the multipart envelope; anything larger is rejected here rather than after a
    # full upload through the gateway.
    client_max_body_size 12m;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # Brute-force budget for the only unauthenticated surface there is. `nodelay` on the burst so
    # a legitimate login is never delayed, only an excess of them rejected.
    limit_req_zone  $binary_remote_addr  zone=authzone:10m  rate=5r/s;
    limit_req_zone  $binary_remote_addr  zone=apizone:10m   rate=50r/s;
    limit_conn_zone $binary_remote_addr  zone=connzone:10m;

    include /etc/nginx/conf.d/*.conf;
}
