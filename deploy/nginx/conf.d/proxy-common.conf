# Included by every location in relay.conf.template, by its path under /etc/nginx/templates —
# the image's envsubst step renders *.template into /etc/nginx/conf.d/ and copies nothing else,
# so a file included from conf.d by that name would simply not be there. It carries no ${RELAY_*}
# placeholders, which is why it does not need rendering in the first place.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Minted here so a request has an id before it reaches any JVM, and so a client-supplied id is
# honoured. Everything downstream — including the Kafka header hop — carries it from there.
proxy_set_header X-Request-Id      $relay_request_id;

proxy_connect_timeout 5s;

# proxy_send_timeout / proxy_read_timeout are deliberately NOT here. This file is included INSIDE
# each location, and /ws and /rtc need 3600s — nginx rejects a duplicate directive in the same
# context, so a location could not override a value set here. They are set once at server level
# instead, where normal inheritance lets a location replace them.
