server:
  port: 8083

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: websocket-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # Per-instance group, not a shared one. Any user's session may live on any instance, so
      # every instance must see every event. A shared group would split partitions across
      # instances and silently drop events at whichever one does not hold the target session.
      group-id: websocket-gateway-${random.uuid}
      # A live push channel must not replay history on restart; clients catch up over REST.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

relay:
  websocket:
    path: /ws
    outbound-buffer-size: 256
    client-id: relay-client
    allowed-origins: "*"
  message-client:
    base-url: lb://message
    membership-ttl: 5m
    max-cached-dialogs: 10000
  presence:
    max-last-seen-entries: 100000

# Registers so the gateway can resolve lb://call and lb://message. Clients connect to port 8083
# directly; api-gateway has no route here and its discovery locator is off.
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Health only, and only so the container orchestration has something to probe. There are no
# metrics and no tracing anywhere in this codebase (ARCHITECTURE.md §9) — exposing `health`
# alone keeps it that way rather than quietly opening /actuator/env and /actuator/heapdump.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.relay: DEBUG
    root: INFO
    # Kafka's clients log a great deal at INFO that is either boilerplate — a full ProducerConfig
    # dump per producer, version banners, metrics-collector chatter — or retry churn: coordinator
    # discovery, metadata refresh, reconnect storms. Measured at 3340 records / 2 MB in a single
    # websocket-gateway startup, and a 445 MB file when a broker stayed unreachable overnight.
    # One line rather than a growing list of named loggers, because every Kafka INFO logger found
    # here so far has been noise. WARN still carries the real failures: disconnects, authentication
    # errors, oversized records, and anything that fails to resolve.
    org.apache.kafka: WARN
    # The exception: this one storms at WARN too while a broker is unreachable.
    org.apache.kafka.clients.NetworkClient: ERROR
  # The console keeps Boot's human pattern on purpose: scripts/start-all.sh greps stdout for
  # ': Started …Kt in N seconds' to decide this service is up. Structured output goes to the
  # file appender only.
  threshold:
    console: DEBUG   # local tail keeps the detail
    file: DEBUG

  pattern:
    correlation: "[%X{requestId:-}] "   # Boot already registers the %correlationId rule
  file:
    # scripts/start-all.sh exports RELAY_LOG_DIR as an absolute path, so it is authoritative there.
    # The bare default is relative to the JVM's cwd and assumes the repo root, which is what IDE
    # run configurations use. Do not make it `../logs`: start-all.sh runs each JVM from its own
    # service directory, but an IDE run would then write a level *above* the repo, outside the
    # directory filebeat bind-mounts — logs land on disk and never reach Kibana.
    name: ${RELAY_LOG_DIR:logs}/json/websocket-gateway.json
  logback:
    rollingpolicy:
      # total-size-cap defaults to 0B == unlimited, which is how this service's log file reached
      # 445 MB. This bounds any future storm regardless of its cause.
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB
      clean-history-on-start: true
  structured:
    format:
      file: ecs      # console deliberately left unset — see the threshold comment above
    json:
      stacktrace:
        max-length: 8192
        include-common-frames: false