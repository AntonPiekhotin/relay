name: WebSocket Gateway CI/CD

on:
  push:
    paths:
      - 'websocket-gateway/**'
      - 'common/**'
      - 'deploy/Dockerfile'
      - '.github/workflows/websocket-gateway.yml'
      - '.github/workflows/service.yml'

jobs:
  ci:
    # Granted on the CALLING job — a reusable workflow's own `permissions:`
    # cannot exceed what its caller was given, and pushing to GHCR needs write.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/service.yml
    with:
      service: websocket-gateway
    secrets: inherit
