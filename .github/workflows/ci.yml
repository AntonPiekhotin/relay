# Build and test the services a branch actually touched.
#
# Same change detection as deploy.yml, but anchored on the merge base rather than on what is
# running in production — here the question is "what did this branch change", not "what is out
# of date on the box". A change under common/ still fans out to all eight services, because
# every one of them embeds it as a published artifact (CLAUDE.md invariant 1).
#
# Images are NOT built here. Nothing on a branch should be pushable to the registry the server
# pulls from; deploy.yml owns that, and only from main.

name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build:     ${{ steps.plan.outputs.build }}
      has_build: ${{ steps.plan.outputs.has_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: plan
        id: plan
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_REF"
          # A brand-new branch reports the all-zero sha as `before`; there is nothing to diff
          # against, so build everything.
          case "$base" in 0000000*|"") base="" ;; esac
          plan=$(scripts/changed-services.sh "$base")
          echo "$plan"
          echo "build=$(echo "$plan" | jq -c '.build')" >> "$GITHUB_OUTPUT"
          echo "has_build=$(echo "$plan" | jq '.build | length > 0')" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one failing service should not hide the others
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: publish common to ~/.m2
        run: cd common && ./gradlew --no-daemon publishToMavenLocal

      # `build` runs the Testcontainers integration tests against the runner's own Docker —
      # a real Postgres per service, as documented in docs/DATA.md.
      - name: build + test ${{ matrix.service }}
        run: cd "${{ matrix.service }}" && ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/
          retention-days: 7

  # The deploy path is shell, and a syntax error in it only shows up mid-deploy.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse the deploy scripts
        run: |
          set -euo pipefail
          for f in scripts/*.sh deploy/*.sh; do bash -n "$f" && echo "ok  $f"; done
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh deploy/*.sh || true
      - name: change detection behaves
        run: |
          set -euo pipefail
          # No base must mean "build everything" — the fallback the first deploy depends on.
          test "$(scripts/changed-services.sh '' | jq '.all')" = "true"
          test "$(scripts/changed-services.sh '' | jq '.build | length')" = "8"
          # An unknown base must not be mistaken for "nothing changed".
          test "$(scripts/changed-services.sh deadbeefdeadbeef | jq '.all')" = "true"