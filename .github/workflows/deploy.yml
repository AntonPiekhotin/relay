# Build and deploy Relay — per service, not per stack.
#
# The shape of this pipeline is dictated by two facts about the repo:
#
#   1. There is no root Gradle build. Every service is its own build, and `common` is consumed
#      from ~/.m2 as a published artifact (CLAUDE.md invariant 1). So every build job publishes
#      `common` first, and a change under common/ rebuilds all eight services.
#   2. The server runs ONE RELAY_IMAGE_TAG for all eight images. A tag must therefore always be
#      a complete set — so services that did not change are copied forward with
#      `buildx imagetools create` (a manifest write, no layers move) rather than rebuilt, and
#      only the ones that did change are restarted.
#
# The base for change detection is the tag currently in deploy/.env on the server, read over ssh.
# That makes the diff "everything since what is actually running", which survives a skipped,
# cancelled or failed run — a diff over the push range would silently lose those commits.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild and redeploy all eight services, ignoring change detection
        type: boolean
        default: false
      full_recreate:
        description: Recreate every container (restarts websocket-gateway — drops live clients)
        type: boolean
        default: false
      skip_tests:
        description: Skip the test suites (use only to ship a fix past a known-broken test)
        type: boolean
        default: false

# Never two deploys at once: they would race the same deploy/.env.
concurrency:
  group: relay-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ══ what changed, relative to what is actually running ════════════════════════════════════
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag:       ${{ steps.plan.outputs.tag }}
      base:      ${{ steps.plan.outputs.base }}
      registry:  ${{ steps.plan.outputs.registry }}
      build:     ${{ steps.plan.outputs.build }}
      retag:     ${{ steps.plan.outputs.retag }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_retag: ${{ steps.plan.outputs.has_retag }}
      infra:     ${{ steps.plan.outputs.infra }}
      compose:   ${{ steps.plan.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # change detection diffs against an arbitrary older commit

      - name: ssh key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no: the deploy key is on this
          # runner, and accepting any host key hands it to whatever answers on port 22.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: read the deployed tag from the server
        id: deployed
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/relay' }}
        run: |
          set -uo pipefail
          base=$(ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_TARGET" \
                   "sed -n 's/^RELAY_IMAGE_TAG=//p' '$DEPLOY_PATH/deploy/.env' | head -1" || echo "")
          # `latest` is not a commit, so it cannot anchor a diff — fall through to a full build.
          [ "$base" = "latest" ] && base=""
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "server reports RELAY_IMAGE_TAG=${base:-<none>}"

      - name: plan
        id: plan
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          BASE: ${{ steps.deployed.outputs.base }}
        run: |
          set -euo pipefail
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

          base="$BASE"
          if [ "$FORCE_ALL" = "true" ]; then base=""; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

          plan=$(scripts/changed-services.sh "$base")
          echo "$plan"
          for k in build retag infra compose; do
            echo "$k=$(echo "$plan" | jq -c ".$k")" >> "$GITHUB_OUTPUT"
          done
          echo "has_build=$(echo "$plan" | jq '.build | length > 0')" >> "$GITHUB_OUTPUT"
          echo "has_retag=$(echo "$plan" | jq '.retag | length > 0')" >> "$GITHUB_OUTPUT"

      - name: summary
        run: |
          {
            echo "### Deploy plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.plan.outputs.tag }}\` |"
            echo "| base (running) | \`${{ steps.plan.outputs.base || 'unknown — full build' }}\` |"
            echo "| rebuild | \`${{ steps.plan.outputs.build }}\` |"
            echo "| copy forward | \`${{ steps.plan.outputs.retag }}\` |"
            echo "| nginx/ELK config | ${{ steps.plan.outputs.infra }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.plan.outputs.compose }}" = "true" ]; then
            {
              echo
              echo "> **docker-compose.prod.yml changed.** Only the rebuilt services are"
              echo "> restarted below. A compose change can affect containers this run will not"
              echo "> touch — re-run this workflow with \`full_recreate\` when you can take a"
              echo "> full restart (websocket-gateway drops every live client)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ══ rebuild the services that changed ═════════════════════════════════════════════════════
  build:
    needs: plan
    if: needs.plan.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Java 25 is required, not preferred — JEP 491 unpinned virtual threads from
          # `synchronized`, and this codebase is blocking-style on virtual threads throughout.
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Cross-building for the deploy host's architecture. Oracle Cloud's free tier is Ampere
      # A1 (arm64) while this runner is amd64 — but this image only copies a jar and apt-gets
      # curl, so there is nothing to compile and QEMU costs seconds, not minutes. A jar is
      # architecture-independent; the JRE base image is not.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The default `docker` driver can neither export a gha cache nor build a multi-platform
      # manifest; buildx's container driver does both.
      - uses: docker/setup-buildx-action@v3

      # Every service resolves com.relay:common:1.0 from mavenLocal. Skipping this is the classic
      # way to ship eight images that all embed a stale `common`.
      - name: publish common to ~/.m2
        run: cd common && ./gradlew --no-daemon publishToMavenLocal

      - name: build ${{ matrix.service }}
        run: |
          cd "${{ matrix.service }}"
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            ./gradlew --no-daemon bootJar -x test
          else
            # `build` runs the Testcontainers integration tests; the runner's Docker is enough.
            ./gradlew --no-daemon build
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root because one deploy/Dockerfile builds all eight services and
      # copies <service>/build/libs/. .dockerignore keeps that context to the jars alone.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=0.0.1-SNAPSHOT
          push: true
          # Both architectures, so the same tag deploys to an Ampere A1 box and to an x86 one.
          # Trim it with the RELAY_PLATFORMS repo variable if you only ever run one.
          platforms: ${{ vars.RELAY_PLATFORMS || 'linux/arm64,linux/amd64' }}
          provenance: false
          tags: |
            ${{ needs.plan.outputs.registry }}/${{ matrix.service }}:${{ needs.plan.outputs.tag }}
            ${{ needs.plan.outputs.registry }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══ copy the unchanged services forward to the new tag ════════════════════════════════════
  # A manifest write, not an image build: nothing is pulled or pushed. Without it the new tag
  # would be an incomplete set and any later `compose pull` would 404 on seven services.
  retag:
    needs: plan
    if: needs.plan.outputs.has_retag == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: point unchanged services at ${{ needs.plan.outputs.tag }}
        env:
          REG:   ${{ needs.plan.outputs.registry }}
          TAG:   ${{ needs.plan.outputs.tag }}
          BASE:  ${{ needs.plan.outputs.base }}
          RETAG: ${{ needs.plan.outputs.retag }}
        run: |
          set -euo pipefail
          for svc in $(echo "$RETAG" | jq -r '.[]'); do
            src=""
            for candidate in "$BASE" latest; do
              [ -n "$candidate" ] || continue
              if docker buildx imagetools inspect "$REG/$svc:$candidate" >/dev/null 2>&1; then
                src="$candidate"; break
              fi
            done
            if [ -z "$src" ]; then
              echo "::error::no image to copy forward for $svc (tried $BASE, latest)." \
                   "Re-run this workflow with force_all to build every service from source."
              exit 1
            fi
            echo "$svc: $src -> $TAG"
            docker buildx imagetools create \
              --tag "$REG/$svc:$TAG" --tag "$REG/$svc:latest" "$REG/$svc:$src"
          done

  # ══ roll it onto the box ══════════════════════════════════════════════════════════════════
  deploy:
    needs: [plan, build, retag]
    if: >-
      ${{ !cancelled()
          && needs.plan.result == 'success'
          && needs.build.result != 'failure' && needs.build.result != 'cancelled'
          && needs.retag.result != 'failure' && needs.retag.result != 'cancelled' }}
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment in repo settings to turn the pipeline into
    # push-to-build / click-to-deploy without touching this file.
    environment:
      name: production
    steps:
      - name: ssh key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: apply
        env:
          SSH_TARGET:  ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SSH_PORT:    ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/relay' }}
          SHA:         ${{ github.sha }}
          TAG:         ${{ needs.plan.outputs.tag }}
          BUILT:       ${{ needs.plan.outputs.build }}
          INFRA:       ${{ needs.plan.outputs.infra }}
          FULL:        ${{ inputs.full_recreate }}
        run: |
          set -euo pipefail
          services=$(echo "${BUILT:-[]}" | jq -r 'join(" ")')
          flags=""
          if [ "$INFRA" = "true" ]; then flags="$flags --infra"; fi
          if [ "$FULL"  = "true" ]; then flags="$flags --full"; fi

          if [ -z "$services" ] && [ -z "$flags" ]; then
            echo "nothing changed since the running tag — not touching the box"
            exit 0
          fi

          # Unquoted heredoc: every variable below expands HERE, on the runner, so the server
          # only ever sees literals.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_TARGET" bash -s <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --prune origin
          # Detached at the exact commit CI built, not at whatever main points to now.
          git -c advice.detachedHead=false checkout --detach "$SHA"
          deploy/remote-apply.sh --tag "$TAG" $flags $services
          REMOTE

      - name: summary
        if: always()
        run: |
          echo "Deployed \`${{ needs.plan.outputs.tag }}\` — restarted: \`${{ needs.plan.outputs.build }}\`" \
            >> "$GITHUB_STEP_SUMMARY"