# Relay log pipeline.
#
# What Logstash earns its RAM for here, stated plainly: the logs arrive as ECS JSON already, so
# filebeat could write to Elasticsearch directly and save ~500 MB of RSS. It is kept for two
# things it does that filebeat cannot do cheaply:
#
#   1. Redaction. auth-service's Apache HttpClient logging prints bearer tokens and the Keycloak
#      client secret verbatim. The levels are capped in auth/src/main/resources/application.yaml,
#      and this file is what survives someone re-enabling them to debug Keycloak — which is
#      exactly how they got enabled in the first place.
#   2. Central, hot-reloadable noise dropping. See config.reload.automatic in logstash.yml.
#
# It earns nothing for parsing or ECS normalisation. Spring Boot already did both.

input {
  beats { port => 5044 }
}

filter {

  # ── 1. Loggers that are a hazard, or pure noise ──────────────────────────────
  #
  # org.apache.http.wire / .headers print credentials in full: `Authorization: Basic <base64
  # client:secret>`, `Authorization: Bearer eyJ...`, and whole token-endpoint responses including
  # refresh tokens. Dropped unconditionally, at any level. Elasticsearch here runs with security
  # disabled behind a passwordless Kibana, so anything indexed is permanently greppable.
  if [log][logger] in ["org.apache.http.wire", "org.apache.http.headers"] {
    drop { }
  }

  # Kafka's clients at INFO and below are boilerplate (a full ProducerConfig dump per producer,
  # version banners) or retry churn (coordinator discovery, metadata refresh, reconnect storms) —
  # 199k of the ~300k lines in the 445 MB websocket-gateway log this pipeline replaces, and 3340
  # records in a single startup. Capped in each service's application.yaml too; this catches an
  # instance running an older jar, and WARN/ERROR still come through.
  if [log][logger] =~ /^org\.apache\.kafka\./ and [log][level] in ["TRACE", "DEBUG", "INFO"] {
    drop { }
  }
  # NetworkClient storms at WARN as well while a broker is unreachable.
  if [log][logger] == "org.apache.kafka.clients.NetworkClient" and [log][level] == "WARN" {
    drop { }
  }

  # ── 2. Redact anything credential-shaped, wherever it turns up ───────────────
  mutate {
    gsub => [
      # compact JWS: header.payload.signature
      "message", "eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}", "<redacted-jwt>",
      "message", "(?i)(authorization|proxy-authorization)\s*:\s*\S+", "\1: <redacted>",
      "message", "(?i)(client_secret|password|refresh_token|access_token)([\"']?\s*[:=]\s*[\"']?)[^\s\"',}]+", "\1\2<redacted>"
    ]
  }
  if [error][stack_trace] {
    mutate {
      gsub => [
        "[error][stack_trace]", "eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}", "<redacted-jwt>"
      ]
    }
  }

  # ── 3. MDC keys -> ECS names, originals kept ─────────────────────────────────
  #
  # The ECS formatter emits MDC entries as-is, so `requestId` would be a dynamically-mapped
  # field. Copying to the ECS names picks up the ecs@mappings component template, which types
  # them as keyword — aggregatable and exact-filterable. The originals stay so raw JSON on disk
  # and documents in Kibana read the same way. Populated once Phase B lands; harmless before.
  if [requestId]  { mutate { copy => { "requestId"  => "[trace][id]" } } }
  if [userId]     { mutate { copy => { "userId"     => "[user][id]" } } }
  if [sessionId]  { mutate { copy => { "sessionId"  => "[labels][session_id]" } } }
  if [kafkaTopic] { mutate { copy => { "kafkaTopic" => "[labels][kafka_topic]" } } }

  # ── 4. Backfill service.name from the filename ───────────────────────────────
  # Boot derives service.name from spring.application.name. eureka sets it explicitly instead,
  # so this is the belt for anything that ever ships without either.
  if ![service][name] and [log][file][path] {
    # Matches both mounted layouts: /relay-repo/logs/json/<svc>.json and
    # /relay-repo/<svc>/logs/json/<svc>.json — see the filebeat globs for why there are two.
    grok { match => { "[log][file][path]" => "/logs/json/%{DATA:[service][name]}\.json$" } }
  }

  mutate { add_field => { "[service][environment]" => "local" } }

  # ── 5. Drop transport bookkeeping ────────────────────────────────────────────
  # event.original is the beats input's verbatim copy of the line, so leaving it in doubles the
  # stored size of every single document for nothing — the parsed fields carry the same content.
  # The rest is logstash/filebeat plumbing that says nothing about the service that logged.
  # `event` and `ecs` are removed as whole objects rather than by leaf: dropping only
  # event.original / ecs.version leaves an empty parent behind, which shows up in Kibana's field
  # list as a field that never has a value. service.node is Boot's, and is only ever populated by
  # logging.structured.ecs.service.node-name, which nothing sets.
  mutate {
    remove_field => ["event", "ecs", "@version", "[service][node]",
                     "[log][file][inode]", "[log][file][device_id]"]
    remove_tag   => ["beats_input_codec_plain_applied"]
  }

  # One pathological log line should not be able to bloat a shard.
  truncate {
    fields => ["message", "[error][stack_trace]"]
    length_bytes => 32768
  }
}

output {
  elasticsearch {
    hosts                 => ["http://elasticsearch:9200"]
    data_stream           => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "relay.app"   # dots are legal here, hyphens are not
    data_stream_namespace => "dev"
  }

  # Uncomment when debugging this pipeline itself, then `docker compose logs -f logstash`.
  # stdout { codec => rubydebug }
}
