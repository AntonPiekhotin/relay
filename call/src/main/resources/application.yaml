# Fixed rather than random, unlike the other business services: the LiveKit container posts
# webhooks here (participant_left, room_finished), and a container cannot ask Eureka where a
# random port landed. Same reasoning as websocket-gateway's fixed 8083. start-all.sh's port grep
# reads the same 'Tomcat started on port N' line either way.
server:
  port: 8084

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: call
  datasource:
    url: jdbc:postgresql://localhost:5436/call
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 15
      connection-timeout: 3000
      validation-timeout: 2000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

relay:
  call:
    ring-timeout: 40s
    sweep-interval: 5s
    ice-buffer-ttl: 5s
    history-page-size: 50
    max-history-page-size: 100
    reconcile-interval: 30s
    reconcile-grace: 30s
    disconnect-grace: 45s
    livekit:
      # `url` is what clients get; `api-url` is what this service calls. Same server, but the two
      # diverge the moment anything is deployed off localhost, so they are two settings from day one.
      url: ${LIVEKIT_URL:ws://localhost:7880}
      api-url: ${LIVEKIT_API_URL:http://localhost:7880}
      api-key: ${LIVEKIT_API_KEY:devkey}
      # Must match the container's key map and be at least 32 characters, or LiveKit refuses to start.
      api-secret: ${LIVEKIT_API_SECRET:relay-livekit-dev-secret-32-chars!!}
      token-ttl: 5m
    group:
      max-participants: 16
    turn:
      urls:
        - stun:localhost:3478
        - turn:localhost:3478?transport=udp
        - turn:localhost:3478?transport=tcp
      static-auth-secret: ${TURN_STATIC_AUTH_SECRET:relay-turn-dev-secret}
      credential-ttl: 12h
  gateway-client:
    base-url: lb://websocket-gateway
    connect-timeout: 2s
    read-timeout: 3s

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Health only, and only so the container orchestration has something to probe. There are no
# metrics and no tracing anywhere in this codebase (ARCHITECTURE.md §9) — exposing `health`
# alone keeps it that way rather than quietly opening /actuator/env and /actuator/heapdump.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.relay: DEBUG
    root: INFO
    # Kafka's clients log a great deal at INFO that is either boilerplate — a full ProducerConfig
    # dump per producer, version banners, metrics-collector chatter — or retry churn: coordinator
    # discovery, metadata refresh, reconnect storms. Measured at 3340 records / 2 MB in a single
    # websocket-gateway startup, and a 445 MB file when a broker stayed unreachable overnight.
    # One line rather than a growing list of named loggers, because every Kafka INFO logger found
    # here so far has been noise. WARN still carries the real failures: disconnects, authentication
    # errors, oversized records, and anything that fails to resolve.
    org.apache.kafka: WARN
    # The exception: this one storms at WARN too while a broker is unreachable.
    org.apache.kafka.clients.NetworkClient: ERROR
  # The console keeps Boot's human pattern on purpose: scripts/start-all.sh greps stdout for
  # ': Started …Kt in N seconds' (readiness) and '(Tomcat|Netty) started on port N' (port
  # discovery). Structured output goes to the file appender only.
  threshold:
    console: DEBUG   # local tail keeps the detail
    file: DEBUG

  pattern:
    correlation: "[%X{requestId:-}] "   # Boot already registers the %correlationId rule
  file:
    # scripts/start-all.sh exports RELAY_LOG_DIR as an absolute path, so it is authoritative there.
    # The bare default is relative to the JVM's cwd and assumes the repo root, which is what IDE
    # run configurations use. Do not make it `../logs`: start-all.sh runs each JVM from its own
    # service directory, but an IDE run would then write a level *above* the repo, outside the
    # directory filebeat bind-mounts — logs land on disk and never reach Kibana.
    name: ${RELAY_LOG_DIR:logs}/json/call.json
  logback:
    rollingpolicy:
      # total-size-cap defaults to 0B == unlimited, which is how one log file reached 445 MB.
      # This bounds any future storm regardless of its cause.
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB
      clean-history-on-start: true
  structured:
    format:
      file: ecs      # console deliberately left unset — see the threshold comment above
    json:
      stacktrace:
        max-length: 8192
        include-common-frames: false
