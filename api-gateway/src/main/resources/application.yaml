server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        # spring-cloud-starter-gateway-server-webflux relocated ALL properties under
        # spring.cloud.gateway.server.webflux.*; the legacy spring.cloud.gateway.* namespace
        # is silently ignored (ARCHITECTURE.md §6.2). Locator stays off so no service gets an
        # automatic /{serviceId}/** route — /internal paths must not be reachable from outside.
        webflux:
          discovery:
            locator:
              enabled: false

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.relay: DEBUG
    org.springframework.security: DEBUG
    web: debug
