server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.relay: DEBUG
    root: INFO
    org.springframework.security: INFO
    web: INFO
  threshold:
    console: DEBUG
    file: DEBUG

  pattern:
    correlation: "[%X{requestId:-}] "
  file:
    name: ${RELAY_LOG_DIR:logs}/json/api-gateway.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB
      clean-history-on-start: true
  structured:
    format:
      file: ecs
    json:
      stacktrace:
        max-length: 8192
        include-common-frames: false
