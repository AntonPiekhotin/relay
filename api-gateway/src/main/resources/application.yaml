server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      discovery:
        locator:
          enabled: false

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.tony: DEBUG
    org.springframework.security: DEBUG
    web: debug
