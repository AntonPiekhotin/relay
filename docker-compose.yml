services:
  keycloak-postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - relay-network

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0
    # --import-realm loads keycloak/import/*.json on startup; existing realms are skipped, not overwritten
    command: start-dev --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - relay-network

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "Yup6_T7LRHezOApR2tbRQA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    networks:
      - relay-network

  notification-db:
    image: postgres:15
    container_name: notification-db
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    networks:
      - relay-network

  call-db:
    image: postgres:15
    container_name: call-db
    environment:
      POSTGRES_DB: call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5436:5432"
    networks:
      - relay-network

  message-db:
    image: postgres:15
    container_name: message-db
    environment:
      POSTGRES_DB: message
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5437:5432"
    networks:
      - relay-network

  session-registry:
    image: redis:7.4-alpine
    container_name: session-registry
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly no
      --save ""
    volumes:
      - session-registry-data:/data
    networks:
      - relay-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # The call media plane. Media never traverses a service, a queue, or a database — the only
  # server-side involvement in audio and video is this relay, and only when a direct peer-to-peer
  # path cannot be found.
  #
  # `--use-auth-secret` is the TURN REST scheme: coturn accepts any username of the form
  # `<expiry>:<userId>` whose password is an HMAC of it under the shared secret, so no per-user TURN
  # account exists and a handed-out credential expires on its own. call-service signs them — the
  # secret below must match `relay.call.turn.static-auth-secret` there.
  #
  # `--external-ip` is not optional even here. coturn allocates its relay inside the bridge network
  # and advertises that address, so without the mapping a client is handed a `172.x` relay candidate
  # it cannot route to — STUN works and TURN silently never relays. Docker's NAT is still a NAT.
  # Point it at the public address in production; the relay port range has to be open there too.
  #
  # TLS is off because dev has no certificates; production needs `turns:` on 5349. Note that
  # `--no-tcp-relay` does not conflict with the `turn:...?transport=tcp` URL call-service hands out:
  # that is the client-to-server leg, which stays available. What it drops is RFC 6062 TCP relay
  # allocations, which WebRTC never asks for.
  #
  # A relay anyone can allocate on is a relay strangers proxy through, so the quotas are a cap
  # rather than a tuning knob: `--total-quota` matches the 41 relay ports, and `--max-bps` of
  # 500 KB/s is roughly a 4 Mbps session. `--no-rfc5780`, `--no-stun-backward-compatibility` and
  # `--response-origin-only-with-rfc5780` switch off STUN features WebRTC does not use and
  # reflection attacks do. `--secure-stun` is deliberately absent: the `stun:` URL in
  # `relay.call.turn.urls` is handed out without credentials, and requiring auth would break it.
  #
  # 169.254/16 is denied because a relay that can reach cloud metadata hands out IAM credentials to
  # anyone holding a TURN credential; loopback peers coturn already denies by default. RFC1918 is
  # deliberately *not* on that list here — behind Docker's NAT every dev peer arrives as a private
  # address, so denying those ranges would block exactly the local calls this file exists to run.
  # Add these three wherever coturn is publicly reachable, or it will relay into your own network:
  #
  #   --denied-peer-ip=10.0.0.0-10.255.255.255
  #   --denied-peer-ip=172.16.0.0-172.31.255.255
  #   --denied-peer-ip=192.168.0.0-192.168.255.255
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: coturn
    restart: unless-stopped
    command: >
      turnserver
      --listening-port=3478
      --realm=relay
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-relay-turn-dev-secret}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --min-port=49160
      --max-port=49200
      --stale-nonce=600
      --no-tcp-relay
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --user-quota=4
      --total-quota=40
      --max-bps=500000
      --bps-capacity=6000000
      --no-rfc5780
      --no-stun-backward-compatibility
      --response-origin-only-with-rfc5780
      --no-software-attribute
      --no-tls
      --no-dtls
      --no-cli
      --log-file=stdout
      --simple-log
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Relay candidates are allocated in this range. Narrow on purpose: Docker publishes each port
      # individually, and the default 49152-65535 would be sixteen thousand of them.
      - "49160-49200:49160-49200/udp"
    networks:
      - relay-network

  # The group-call media plane (SFU). Same doctrine as coturn one block up: media never traverses
  # a service — call-service only mints room tokens (signed JWTs, room = callId) and consumes this
  # container's webhooks; clients connect here directly on 7880 with the token they were handed.
  # 1:1 calls do not use this at all; they stay peer-to-peer through coturn.
  #
  # The whole config rides in the LIVEKIT_CONFIG env var rather than a mounted file, because
  # compose substitutes ${...} inside it — a config file cannot take the secret from the
  # environment without a template step. The api key/secret pair must match
  # `relay.call.livekit.api-key/api-secret` in call/application.yaml, and LiveKit refuses secrets
  # shorter than 32 characters.
  #
  # `node_ip` is coturn's `--external-ip` lesson again: LiveKit allocates media inside the bridge
  # network, and without the override it advertises its 172.x address in ICE candidates — clients
  # connect, signaling works, and media silently never flows. Point it at the public address in
  # production.
  #
  # `udp_port` (a single multiplexed UDP port) instead of the default 50000-60000 range: every
  # participant shares 7882, so there is one published UDP port instead of ten thousand mappings,
  # and no collision with coturn's 49160-49200. 7881 is ICE over TCP, the fallback for UDP-hostile
  # networks.
  #
  # `room_finished` fires ~60s (empty_timeout) after the last participant drops; call-service's
  # webhook handler uses it as the end-of-call backstop. The webhook URL points at the host because
  # the relay services run as host JVMs, not containers — host-gateway makes that name resolve on
  # Linux too, and call-service listens on the fixed 8084 precisely so this URL can exist.
  livekit:
    image: livekit/livekit-server:v1.9
    container_name: livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-relay-livekit-dev-secret-32-chars!!}
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        room:
          auto_create: true
          empty_timeout: 60
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - http://host.docker.internal:8084/internal/api/v1/livekit/webhooks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"        # ws/http — client signaling, RoomService API, webhooks' source
      - "7881:7881"        # ICE over TCP fallback
      - "7882:7882/udp"    # all media, multiplexed
    networks:
      - relay-network

  # --- Logging stack (ELK) — dev only, opt-in ----------------------------------------------
  #
  #   docker compose --profile logging up -d          (or: scripts/start-all.sh --infra --logging)
  #
  # Profile-gated on purpose. These four cost ~2.2 GB of RAM, and a plain `docker compose up -d`
  # — which is what scripts/start-all.sh --infra runs — must stay as cheap as it is today. Docker
  # Desktop needs >= 6 GB allocated before enabling this, or Elasticsearch is OOM-killed mid-index.
  #
  # The relay services run on the HOST as plain `java -jar` processes, not in containers, so there
  # is no docker log driver to read. The hand-off is a file: each JVM writes ECS JSON to
  # logs/json/<service>.json (see logging.file.name in each application.yaml) and filebeat reads
  # that directory through a read-only bind mount. The consequence worth knowing is that ELK being
  # down never affects a service — the files are the buffer, and filebeat resumes from its registry.
  #
  # All four images MUST carry the identical tag. A filebeat one minor ahead of logstash is the
  # most common way this setup breaks, and it breaks as an opaque handshake error.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.4}
    container_name: elasticsearch
    profiles: ["logging"]
    environment:
      node.name: relay-es
      discovery.type: single-node
      # Dev only: no TLS, no password, :9200 open to anything on the host. Which is precisely why
      # the credential redaction in elk/logstash/pipeline/relay.conf is not optional.
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ingest.geoip.downloader.enabled: "false"
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.watermark.low: 90%
      cluster.routing.allocation.disk.watermark.high: 95%
      cluster.routing.allocation.disk.watermark.flood_stage: 97%
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - relay-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.17.4}
    container_name: logstash
    profiles: ["logging"]
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.monitoring.enabled: "false"
      # Settings go here rather than in a mounted logstash.yml on purpose. This image's entrypoint
      # runs env2yaml, which REWRITES config/logstash.yml at boot: bind-mounting that file read-only
      # crash-loops the container ("read-only file system"), and mounting it writable would let the
      # container edit the file in this repo. Env vars are the supported route — uppercase the
      # setting name and turn dots into underscores.
      HTTP_HOST: "0.0.0.0"
      # Edit elk/logstash/pipeline/relay.conf and it takes effect in ~5s with no restart. This is
      # most of why logstash is in the pipeline at all: each service's application.yaml is baked
      # into its bootJar, so muting a chatty logger there costs a rebuild and a restart.
      CONFIG_RELOAD_AUTOMATIC: "true"
      CONFIG_RELOAD_INTERVAL: "5s"
      PIPELINE_WORKERS: "2"
      PIPELINE_BATCH_SIZE: "250"
      LOG_LEVEL: "info"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      # Node stats API, for the healthcheck and for `curl localhost:9600/_node/stats`. The beats
      # input on 5044 needs no host publication — filebeat reaches it on relay-network.
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - relay-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/stats || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.4}
    container_name: kibana
    profiles: ["logging"]
    environment:
      SERVER_NAME: kibana
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # Must be >= 32 chars, or Kibana generates a fresh one each boot and loses every saved
      # object (data views, saved searches) along with it.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "relay-dev-kibana-encryption-key-000000"
      NODE_OPTIONS: "--max-old-space-size=768"
      TELEMETRY_OPTIN: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - relay-network

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.17.4}
    container_name: filebeat
    profiles: ["logging"]
    # Both of these are required, and their absence is the classic
    # "Exiting: error loading config file" on Docker Desktop: filebeat refuses a config file it
    # does not own, and a macOS bind mount cannot hand it uid-0 ownership.
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # The repo root, read-only, rather than just ./logs/json — because where a service writes
      # depends on its working directory, and the two launchers disagree. start-all.sh runs each JVM
      # from its own service directory (and exports an absolute RELAY_LOG_DIR), while IntelliJ picks
      # the working directory per module with no WORKING_DIRECTORY set, giving the repo root for some
      # services and the module directory for others. Mounting the root lets filebeat.yml glob both
      # <repo>/logs/json and <repo>/<service>/logs/json, so no run configuration has to be fixed by
      # hand and a mis-set cwd cannot silently strand logs off the mount. Filebeat only ever reads,
      # and the globs are explicit, so nothing else in the repo is touched.
      - ./:/relay-repo:ro
      # Must stay a named volume: the read registry lives here, and a bind mount would lose it on
      # `compose down` and re-ship every file from the top.
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_started
    networks:
      - relay-network

volumes:
  kafka_data:
  keycloak_postgres_data:
  session-registry-data:
  elasticsearch_data:
  filebeat_data:

networks:
  relay-network:
    driver: bridge