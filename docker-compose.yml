services:
  keycloak-postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - relay-network

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0
    # --import-realm loads keycloak/import/*.json on startup; existing realms are skipped, not overwritten
    command: start-dev --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - relay-network

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "Yup6_T7LRHezOApR2tbRQA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    networks:
      - relay-network

  notification-db:
    image: postgres:15
    container_name: notification-db
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    networks:
      - relay-network

  call-db:
    image: postgres:15
    container_name: call-db
    environment:
      POSTGRES_DB: call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5436:5432"
    networks:
      - relay-network

  message-db:
    image: postgres:15
    container_name: message-db
    environment:
      POSTGRES_DB: message
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5437:5432"
    networks:
      - relay-network

  session-registry:
    image: redis:7.4-alpine
    container_name: session-registry
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly no
      --save ""
    volumes:
      - session-registry-data:/data
    networks:
      - relay-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # The call media plane. Media never traverses a service, a queue, or a database — the only
  # server-side involvement in audio and video is this relay, and only when a direct peer-to-peer
  # path cannot be found.
  #
  # `--use-auth-secret` is the TURN REST scheme: coturn accepts any username of the form
  # `<expiry>:<userId>` whose password is an HMAC of it under the shared secret, so no per-user TURN
  # account exists and a handed-out credential expires on its own. call-service signs them — the
  # secret below must match `relay.call.turn.static-auth-secret` there.
  #
  # `--external-ip` is not optional even here. coturn allocates its relay inside the bridge network
  # and advertises that address, so without the mapping a client is handed a `172.x` relay candidate
  # it cannot route to — STUN works and TURN silently never relays. Docker's NAT is still a NAT.
  # Point it at the public address in production; the relay port range has to be open there too.
  #
  # TLS is off because dev has no certificates; production needs `turns:` on 5349. Note that
  # `--no-tcp-relay` does not conflict with the `turn:...?transport=tcp` URL call-service hands out:
  # that is the client-to-server leg, which stays available. What it drops is RFC 6062 TCP relay
  # allocations, which WebRTC never asks for.
  #
  # A relay anyone can allocate on is a relay strangers proxy through, so the quotas are a cap
  # rather than a tuning knob: `--total-quota` matches the 41 relay ports, and `--max-bps` of
  # 500 KB/s is roughly a 4 Mbps session. `--no-rfc5780`, `--no-stun-backward-compatibility` and
  # `--response-origin-only-with-rfc5780` switch off STUN features WebRTC does not use and
  # reflection attacks do. `--secure-stun` is deliberately absent: the `stun:` URL in
  # `relay.call.turn.urls` is handed out without credentials, and requiring auth would break it.
  #
  # 169.254/16 is denied because a relay that can reach cloud metadata hands out IAM credentials to
  # anyone holding a TURN credential; loopback peers coturn already denies by default. RFC1918 is
  # deliberately *not* on that list here — behind Docker's NAT every dev peer arrives as a private
  # address, so denying those ranges would block exactly the local calls this file exists to run.
  # Add these three wherever coturn is publicly reachable, or it will relay into your own network:
  #
  #   --denied-peer-ip=10.0.0.0-10.255.255.255
  #   --denied-peer-ip=172.16.0.0-172.31.255.255
  #   --denied-peer-ip=192.168.0.0-192.168.255.255
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: coturn
    restart: unless-stopped
    command: >
      turnserver
      --listening-port=3478
      --realm=relay
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-relay-turn-dev-secret}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --min-port=49160
      --max-port=49200
      --stale-nonce=600
      --no-tcp-relay
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --user-quota=4
      --total-quota=40
      --max-bps=500000
      --bps-capacity=6000000
      --no-rfc5780
      --no-stun-backward-compatibility
      --response-origin-only-with-rfc5780
      --no-software-attribute
      --no-tls
      --no-dtls
      --no-cli
      --log-file=stdout
      --simple-log
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Relay candidates are allocated in this range. Narrow on purpose: Docker publishes each port
      # individually, and the default 49152-65535 would be sixteen thousand of them.
      - "49160-49200:49160-49200/udp"
    networks:
      - relay-network

volumes:
  kafka_data:
  keycloak_postgres_data:
  session-registry-data:

networks:
  relay-network:
    driver: bridge