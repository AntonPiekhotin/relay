services:
  keycloak-postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - relay-network

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0
    # --import-realm loads keycloak/import/*.json on startup; existing realms are skipped, not overwritten
    command: start-dev --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - relay-network

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "Yup6_T7LRHezOApR2tbRQA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    networks:
      - relay-network

  notification-db:
    image: postgres:15
    container_name: notification-db
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    networks:
      - relay-network

  call-db:
    image: postgres:15
    container_name: call-db
    environment:
      POSTGRES_DB: call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5436:5432"
    networks:
      - relay-network

  message-db:
    image: postgres:15
    container_name: message-db
    environment:
      POSTGRES_DB: message
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5437:5432"
    networks:
      - relay-network

  session-registry:
    image: redis:7.4-alpine
    container_name: session-registry
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly no
      --save ""
    volumes:
      - session-registry-data:/data
    networks:
      - relay-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # The call media plane. Media never traverses a service, a queue, or a database — the only
  # server-side involvement in audio and video is this relay, and only when a direct peer-to-peer
  # path cannot be found.
  #
  # `--use-auth-secret` is the TURN REST scheme: coturn accepts any username of the form
  # `<expiry>:<userId>` whose password is an HMAC of it under the shared secret, so no per-user TURN
  # account exists and a handed-out credential expires on its own. call-service signs them — the
  # secret below must match `relay.call.turn.static-auth-secret` there.
  #
  # Two things must change for anything but localhost: `--external-ip` has to name the public
  # address (coturn advertises candidates it cannot otherwise discover behind NAT), and the relay
  # port range below has to be opened on the firewall. TLS is off because dev has no certificates;
  # production needs `turns:` on 5349.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: coturn
    restart: unless-stopped
    command: >
      turnserver
      --listening-port=3478
      --realm=relay
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-relay-turn-dev-secret}
      --min-port=49160
      --max-port=49200
      --no-tls
      --no-dtls
      --no-cli
      --log-file=stdout
      --simple-log
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Relay candidates are allocated in this range. Narrow on purpose: Docker publishes each port
      # individually, and the default 49152-65535 would be sixteen thousand of them.
      - "49160-49200:49160-49200/udp"
    networks:
      - relay-network

volumes:
  kafka_data:
  keycloak_postgres_data:
  session-registry-data:

networks:
  relay-network:
    driver: bridge