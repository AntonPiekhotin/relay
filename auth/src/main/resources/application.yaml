server:
  port: 0

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: auth
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

keycloak:
  url: "http://localhost:8081"
  realm: "relay-realm"
  client-id: "relay-client"
  client-secret: "D0t5nQjQJAfrj7uSkChM6MkYpo1Mm2FA"

user-service:
  base-url: "lb://user"
  users-path: "/internal/api/v1/users"
  request-timeout: 5s
  connect-timeout: 2s

kafka:
  bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.relay: DEBUG
    root: INFO
    web: INFO
    org.apache.http: WARN
    org.keycloak: INFO
    org.jboss.resteasy: INFO
  threshold:
    console: DEBUG
    file: DEBUG

  pattern:
    correlation: "[%X{requestId:-}] "
  file:
    name: ${RELAY_LOG_DIR:logs}/json/auth.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB
      clean-history-on-start: true
  structured:
    format:
      file: ecs
    json:
      stacktrace:
        max-length: 8192
        include-common-frames: false
