server:
  port: 0

spring:
  application:
    name: notification
  datasource:
    url: jdbc:postgresql://localhost:5435/notification
    username: postgres
    password: postgres
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities still match it and fails
    # fast on drift. `update` never dropped or narrowed anything, so drift accumulated silently.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Shared group on purpose: push requests are work to be processed exactly once, so
      # instances compete for partitions (unlike the gateway's per-instance broadcast groups).
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

relay:
  push:
    fcm:
      # Off by default so the service runs without Firebase credentials (LoggingPushSender).
      enabled: true
      credentials-location: ${FCM_CREDENTIALS_LOCATION:file:../secrets/fcm-service-account-credentials.json}
      # With enabled=true, dry-run=true asks FCM to validate credentials/token/payload without
      # delivering anything — the smoke test before a client app exists.
      dry-run: true

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.relay: DEBUG
    root: INFO