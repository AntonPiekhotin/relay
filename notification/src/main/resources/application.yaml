server:
  port: 0

spring:
  application:
    name: notification
  datasource:
    url: jdbc:postgresql://localhost:5435/notification
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Shared group on purpose: push requests are work to be processed exactly once, so
      # instances compete for partitions (unlike the gateway's per-instance broadcast groups).
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.relay: DEBUG
    root: INFO