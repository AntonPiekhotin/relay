server:
  port: 0

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: notification
  datasource:
    url: jdbc:postgresql://localhost:5435/notification
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 15
      connection-timeout: 3000
      validation-timeout: 2000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/relay-realm
          jwk-set-uri: http://localhost:8081/realms/relay-realm/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Shared group on purpose: push requests are work to be processed exactly once, so
      # instances compete for partitions (unlike the gateway's per-instance broadcast groups).
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

relay:
  push:
    fcm:
      # Off by default so the service runs without Firebase credentials (LoggingPushSender).
      enabled: true
      credentials-location: ${FCM_CREDENTIALS_LOCATION:file:../secrets/fcm-service-account-credentials.json}
      dry-run: false
    apns:
      # Off until an Apple .p8 signing key exists. Without it, iOS incoming-call pushes ride FCM's
      # data-only path — which cannot ring a locked iPhone; only apns-push-type: voip can.
      enabled: false
      signing-key-location: ${APNS_SIGNING_KEY_LOCATION:file:../secrets/apns-signing-key.p8}
      team-id: ${APNS_TEAM_ID:}
      key-id: ${APNS_KEY_ID:}
      bundle-id: ${APNS_BUNDLE_ID:com.relay.app}
      # sandbox | production — which APNs host to talk to. Sandbox tokens are rejected by
      # production and vice versa, so a "BadDeviceToken" here is often just the wrong environment.
      environment: sandbox

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.relay: DEBUG
    root: INFO
    # Kafka's clients log a great deal at INFO that is either boilerplate — a full ProducerConfig
    # dump per producer, version banners, metrics-collector chatter — or retry churn: coordinator
    # discovery, metadata refresh, reconnect storms. Measured at 3340 records / 2 MB in a single
    # websocket-gateway startup, and a 445 MB file when a broker stayed unreachable overnight.
    # One line rather than a growing list of named loggers, because every Kafka INFO logger found
    # here so far has been noise. WARN still carries the real failures: disconnects, authentication
    # errors, oversized records, and anything that fails to resolve.
    org.apache.kafka: WARN
    # The exception: this one storms at WARN too while a broker is unreachable.
    org.apache.kafka.clients.NetworkClient: ERROR
  # The console keeps Boot's human pattern on purpose: scripts/start-all.sh greps stdout for
  # ': Started …Kt in N seconds' (readiness) and '(Tomcat|Netty) started on port N' (port
  # discovery). This service runs server.port: 0, so JSON on the console would make it
  # unfindable. Structured output goes to the file appender only.
  threshold:
    console: DEBUG   # local tail keeps the detail
    file: INFO       # only INFO+ reaches Elasticsearch
  pattern:
    correlation: "[%X{requestId:-}] "   # Boot already registers the %correlationId rule
  file:
    # scripts/start-all.sh exports RELAY_LOG_DIR as an absolute path, so it is authoritative there.
    # The bare default is relative to the JVM's cwd and assumes the repo root, which is what IDE
    # run configurations use. Do not make it `../logs`: start-all.sh runs each JVM from its own
    # service directory, but an IDE run would then write a level *above* the repo, outside the
    # directory filebeat bind-mounts — logs land on disk and never reach Kibana.
    name: ${RELAY_LOG_DIR:logs}/json/notification.json
  logback:
    rollingpolicy:
      # total-size-cap defaults to 0B == unlimited, which is how one log file reached 445 MB.
      # This bounds any future storm regardless of its cause.
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB
      clean-history-on-start: true
  structured:
    format:
      file: ecs      # console deliberately left unset — see the threshold comment above
    json:
      stacktrace:
        max-length: 8192
        include-common-frames: false